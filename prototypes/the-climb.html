<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Climb — GillyLab prototype</title>
<!--
  PROTOTYPE. Deliberately ugly. Needs a local server (it fetches climb-data.json):
      python3 -m http.server        then  localhost:8000/prototypes/the-climb.html

  This exists to answer ONE question no amount of measuring can: is the run fun?
  Everything else is tunable. Play three runs. If you find yourself thinking
  "one more, I'll build him differently" — it works.

  THE ONE RULE: the fights are scored by the REAL simulator (climb-scorer.js is
  scripts/sim-backtest/_scorer.cjs verbatim, browser-wrapped). No fake difficulty
  curve, no rubber-banding. When Topuria beats you it's because the model that
  prices real fights says he beats you.

  Measured before building any of this:
    - build swing      ~31 pts   (terrible -> god-stats, vs Topuria)
    - finishing style  ~ 8 pts   (same record, finishes vs decisions)
    - record           ~ 6 pts   (0-0 -> 8-0 over a murderers' row)
  So the BUILD dominates. Upgrade points are the game's lever, because the model
  won't supply the risk/reward on its own — beating a contender is worth ~1pt
  more than beating a can. That asymmetry is a design problem to tune, not a
  model bug.
-->
<style>
  :root{ --bg:#0a0a0b; --surface:#111114; --surface2:#18181d; --border:#2a2a32;
    --accent:#00e668; --accent2:#ff3d00; --gold:#ffc531; --text:#f0f0f0; --muted:#666672; --card:#14141a; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:1rem}
  .wrap{max-width:820px;margin:0 auto}
  h1{font-size:1.3rem;margin:0 0 .1rem;letter-spacing:-.02em}
  h1 .g{color:var(--accent)}
  .sub{color:var(--muted);font-size:.78rem;margin:0 0 1rem}
  .panel{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:.9rem;margin:.7rem 0}
  .rl{color:var(--muted);font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;margin-bottom:.4rem}

  /* attribute sliders */
  .attr{display:grid;grid-template-columns:120px 1fr 42px;gap:.6rem;align-items:center;margin:.35rem 0}
  .attr label{font-size:.8rem}
  .attr .v{font-size:.8rem;color:var(--accent);text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--accent)}
  .pts{font-size:.9rem;font-weight:700}
  .pts.over{color:var(--accent2)}

  /* opponent cards */
  .opps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.6rem}
  .opp{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:.7rem;cursor:pointer;text-align:left;color:inherit;font:inherit}
  .opp:hover{border-color:var(--accent)}
  .opp .nm{font-size:.92rem;font-weight:700}
  .opp .rk{font-size:.65rem;color:var(--gold);text-transform:uppercase;letter-spacing:.06em}
  .opp .rec{font-size:.72rem;color:var(--muted);margin:.2rem 0 .45rem}
  .opp .odds{font-size:.75rem}
  .opp .rw{font-size:.68rem;color:var(--accent);margin-top:.3rem}
  .opp.risky{border-color:rgba(255,61,0,.5)}

  /* record + status */
  .hud{display:flex;gap:1.2rem;flex-wrap:wrap;align-items:baseline}
  .hud div span{color:var(--muted);font-size:.62rem;text-transform:uppercase;letter-spacing:.07em;display:block}
  .hud div b{font-size:1.1rem}
  .log{font-size:.78rem;line-height:1.8}
  .log .w{color:var(--accent)} .log .l{color:var(--accent2)}
  .big{font-size:1.05rem;font-weight:700;margin:.3rem 0}
  .big.win{color:var(--accent)} .big.loss{color:var(--accent2)}
  button.btn{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:.45rem .9rem;font-size:.8rem;cursor:pointer;font-weight:600}
  button.btn.pri{background:var(--accent);color:#04120a;border-color:var(--accent)}
  button.btn:hover{border-color:var(--accent)}
  .load{color:var(--muted);padding:2rem 0;text-align:center}
  .note{color:var(--muted);font-size:.72rem;line-height:1.5;margin-top:.4rem}
</style>
</head>
<body>
<div class="wrap">
  <h1>The <span class="g">Climb</span></h1>
  <p class="sub">Build a fighter. Pick your fights. Two losses and you're cut.
    Every fight is scored by the real GillyLab simulator — no fake difficulty.</p>
  <div id="app"><div class="load">Loading the division…</div></div>
</div>

<script src="climb-scorer.js"></script>
<script>
const $ = s => document.querySelector(s);
let D=null, S=null, ME='__YOU__';
let G=null;   // game state

// ── the attribute sheet ──────────────────────────────────────────────────────
// Vague on the front, specific on the back — the player sees "Power", the model
// sees kd + slpm. Every point MUST move a lever the sim actually reads, or the
// slider is a lie. The sim's 9 settable levers are bundled into 5 archetypes.
//
// Cardio is deliberately ABSENT: the sim has no cardio input. What it has is
// bigFightExperience ("composure and cardio when a fight goes long") — EARNED by
// surviving five-round fights, not bought. So you can't buy a gas tank here,
// same as real life.
const ATTRS = [
  { id:'power',    label:'Power',        note:'kd, slpm',           apply:(s,v)=>{ s.kd = 0.1+v*0.55; s.slpm = 2.0+v*0.9; } },
  { id:'technique',label:'Technique',    note:'strAcc, slpm',       apply:(s,v)=>{ s.strAcc = pct(28+v*6); s.slpm = (s.slpm||2)+v*0.35; } },
  { id:'defense',  label:'Defense',      note:'strDef, sapm',       apply:(s,v)=>{ s.strDef = pct(40+v*5.5); s.sapm = 6.0-v*0.45; } },
  { id:'grappling',label:'Grappling',    note:'tdLanded, tdAcc, subAvg', apply:(s,v)=>{ s.tdLanded = 0.2+v*0.75; s.tdAcc = pct(20+v*6); s.subAvg = 0.05+v*0.35; } },
  { id:'takedef',  label:'Takedown def', note:'tdDef',              apply:(s,v)=>{ s.tdDef = pct(35+v*6); } },
];
// Playtest: "you get a ton of upgrades right off the bat". You started with 20,
// spent 10 on the floor of 2/attr, and had 10 to dump before fight one — plus
// rewards up to +8. The creator screen was the whole game.
// Now: 12 points, floor of 1, so 7 to place. Rewards are 1-3.
const POINTS_START = 12, ATTR_MAX = 10;
const pct = n => Math.round(n)+'%';

function buildStats(a){
  const s = { ht:"5'11\"", dob:"1999-01-01", reach:'72"', stance:'Orthodox',
    slpm:0, strAcc:'0%', sapm:0, strDef:'0%', kd:0, tdLanded:0, tdAcc:'0%',
    tdDef:'0%', subAvg:0, finRate:'0%', streak:0, gym:'—' };
  for (const A of ATTRS) A.apply(s, a[A.id]||0);
  // finRate is EARNED, not set — it's derived from how you actually win. Start
  // neutral; the run overwrites it. (A career of decisions tanks it, which is
  // the model correctly noticing you can't finish anyone.)
  const fin = G && G.log.length ? Math.round(100*G.log.filter(f=>f.won&&f.fin).length/Math.max(1,G.log.filter(f=>f.won).length)) : 50;
  s.finRate = fin+'%';
  s.streak = G ? G.streak : 0;
  return s;
}

// ── scoring a fight with the REAL sim ────────────────────────────────────────
function winProb(oppName){
  const stats = Object.assign(Object.create(null), D.FIGHTER_STATS);
  const hist  = Object.assign(Object.create(null), D.FIGHT_HISTORY);
  const fighters = D.FIGHTERS.slice();
  stats[ME] = buildStats(G.attrs);
  hist[ME]  = G.log.map((f,i)=>({
    date: fmtDate(new Date(Date.now() - (G.log.length-i)*120*864e5)),
    opponent: f.opp, result: f.won?'W':'L',
    method: f.fin ? 'KO/TKO' : 'Decision (Unanimous)',
    round: f.fin?2:3, time: f.fin?'3:20':'5:00',
    event: 'UFC Fight Night: The Climb', org: 'UFC'
  })).reverse();
  fighters.push({ name:ME, division:D.division, rank:'NR',
    record:G.wins+'-'+G.losses+'-0', initials:'YOU', country:'USA' });
  S.setStats(stats); S.setHistory(hist); S.setFighters(fighters);
  S.setNow(Date.now()); S.setRankBadge(null);
  const p = S.simWinProbability(ME, oppName);
  return (p==null) ? 0.5 : p;
}
const fmtDate = d => d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
// P(win >= 2 of 3 rounds). The card shows THIS, not the per-round number —
// showing 92% and then losing 8% of the time was the whole complaint.
const bo3 = p => 3*p*p*(1-p) + p*p*p;
const amer = p => { const o = p>=0.5 ? -Math.round(100*p/(1-p)) : Math.round(100*(1-p)/p); return (o>0?'+':'')+o; };

// ── opponent selection ───────────────────────────────────────────────────────
// Three choices, escalating. Ranked opponents are worth more upgrade points —
// the model only pays ~1pt more for beating a contender than a can, so the
// RISK/REWARD HAS TO COME FROM HERE. This is the main tuning dial.
function offers(){
  const unranked = D.ladder.filter(f=>f.rankNum===99 && !G.beat.has(f.name));
  const ranked   = D.ladder.filter(f=>f.rankNum<99 && !G.beat.has(f.name)).sort((a,b)=>b.rankNum-a.rankNum);
  const pool = [];
  if (G.rank == null) {
    // unranked phase: three gatekeepers of rising quality
    const s = unranked.slice().sort((a,b)=>winProb(b.name)-winProb(a.name));
    pool.push(s[0], s[Math.floor(s.length/2)], s[s.length-1]);
  } else {
    // Ranked phase: someone below, someone near, someone a few spots ABOVE.
    //
    // The first version sorted 'above' descending and took the last element —
    // which is always the CHAMPION. So a #15 got offered a title shot and the
    // average run was 3.6 fights with a 48% belt rate. Caught by simulating 25
    // runs, not by reading the code.
    //
    // Now: the step-up is capped to a few spots, and the champion is only
    // offered once you're #1 (or interim). That's what makes it a climb rather
    // than a coin flip. MAIN TUNING DIAL — widen STEP for a faster game.
    const STEP = 3;
    const below = ranked.filter(f=>f.rankNum>G.rank && f.rankNum<99);
    const near  = ranked.filter(f=>Math.abs(f.rankNum-G.rank)<=1 && f.rankNum!==G.rank);
    const up    = ranked.filter(f=>f.rankNum<G.rank && f.rankNum>=G.rank-STEP && f.rankNum>0.5);
    const title = ranked.filter(f=>f.rankNum<=0.5);   // champ + interim
    pool.push(below[0], near[0] || up[0], (G.rank<=1 ? title[0] : null) || up[up.length-1]);
    // Fallbacks so the offer list is never empty at the top of the ladder.
    if(!pool.filter(Boolean).length) pool.push(...ranked.slice(0,3));
  }
  return pool.filter(Boolean).filter((f,i,a)=>a.indexOf(f)===i).map(f=>{
    const p = winProb(f.name);
    // Reward scales with how much of a dog you are. This is THE risk/reward
    // dial: the model only pays ~1pt more for beating a contender than a can,
    // so the incentive to take a hard fight has to be manufactured here.
    // Capped at 3 — +8 made one upset worth more than the whole early career.
    const reward = Math.max(1, Math.min(3, Math.round((1-p)*5)));
    const jump = f.rankNum<99 ? f.rankNum : null;
    return { f, p, reward, jump };
  });
}

// A fight is THREE ROUNDS, not one coin flip.
//
// Playtest: "I lost against someone I was favored 79% over, then lost to someone
// I was 92% over ... that makes it entirely RNG based, more luck than anything."
// Correct. One flip per fight meant an 8% roll ended a run you had no input on,
// and the only decision was picking the highest number.
//
// The fix isn't to fudge the model, it's to use it honestly: the sim's number
// prices a ROUND. Win 2 of 3 and you win the fight. That sharpens the extremes
// and leaves close fights as coin flips, which is exactly where drama belongs:
//     92% -> 98.2%   (upsets 8% -> 1.8%)
//     79% -> 88.6%
//     50% -> 50.0%   (unchanged — a pick'em is still a pick'em)
//     30% -> 21.6%   (underdog runs get HARDER, correctly: beating a contender
//                     should mean something)
// It also gives the run a story for free — "you won rounds 1 and 3".
function fight(o){
  const rounds = [0,1,2].map(()=>Math.random() < o.p);
  const roundsWon = rounds.filter(Boolean).length;
  const won = roundsWon >= 2;
  // Finish chance scales with Power/Grappling — how you win matters (~8pts to
  // the model), so the build should drive it.
  const finBias = (G.attrs.power + G.attrs.grappling) / (ATTR_MAX*2);
  const fin = won && Math.random() < (0.25 + finBias*0.4);
  G.log.push({ opp:o.f.name, won, fin, p:o.p, rank:o.f.rankNum, rounds, roundsWon });
  if (won){
    G.wins++; G.streak++; G.beat.add(o.f.name);
    G.pts += o.reward + (fin?1:0);
    if (o.jump != null && (G.rank==null || o.jump < G.rank)) G.rank = o.jump;
    else if (G.rank==null && G.wins>=3) G.rank = 15;
    if (o.f.rankNum === 0) G.champ = true;
  } else {
    G.losses++; G.streak = 0;
  }
  G.last = { o, won, fin };
  render();
}

// ── render ───────────────────────────────────────────────────────────────────
function newGame(){
  G = { attrs:Object.fromEntries(ATTRS.map(a=>[a.id,1])), pts:POINTS_START - ATTRS.length*1,
        wins:0, losses:0, streak:0, rank:null, log:[], beat:new Set(), champ:false, started:false, last:null };
  render();
}
const spent = () => ATTRS.reduce((s,a)=>s+G.attrs[a.id],0);

function render(){
  const app = $('#app'); app.innerHTML='';
  if (!G.started){ app.appendChild(creator()); return; }
  app.appendChild(hud());
  if (G.champ){ app.appendChild(endBox('CHAMPION. You did it.')); return; }
  if (G.losses>=2){ app.appendChild(endBox('Cut. Two losses.')); return; }
  if (G.last) app.appendChild(resultBox());
  app.appendChild(upgrade());
  app.appendChild(offerBox());
  app.appendChild(logBox());
}

function creator(){
  const p=document.createElement('div'); p.className='panel';
  p.innerHTML='<div class="rl">Create your fighter</div>';
  const left=POINTS_START-spent();
  for(const A of ATTRS){
    const row=document.createElement('div'); row.className='attr';
    const l=document.createElement('label'); l.textContent=A.label;
    const i=document.createElement('input'); i.type='range'; i.min=0; i.max=ATTR_MAX; i.value=G.attrs[A.id];
    i.oninput=e=>{ const v=+e.target.value; const d=v-G.attrs[A.id];
      if (spent()+d>POINTS_START) { e.target.value=G.attrs[A.id]; return; }
      G.attrs[A.id]=v; render(); };
    const v=document.createElement('div'); v.className='v'; v.textContent=G.attrs[A.id];
    row.appendChild(l); row.appendChild(i); row.appendChild(v);
    p.appendChild(row);
  }
  const f=document.createElement('div');
  f.innerHTML='<div class="pts'+(left<0?' over':'')+'" style="margin:.6rem 0">Points left: '+left+'</div>';
  p.appendChild(f);
  const hint=document.createElement('div'); hint.className='note';
  hint.innerHTML='<b>Power</b> is knockdowns + volume · <b>Technique</b> is accuracy · '+
    '<b>Defense</b> is not getting hit · <b>Grappling</b> is takedowns + subs · '+
    '<b>Takedown def</b> is staying upright.<br>Once you turn pro, every +1 shows '+
    'exactly what it\'s worth against your next opponent.';
  p.appendChild(hint);
  const note=document.createElement('div'); note.className='note';
  note.textContent='No cardio slider — the sim has no cardio input. What it has is five-round experience, and you earn that by surviving deep water. Same as real life.';
  p.appendChild(note);
  const b=document.createElement('button'); b.className='btn pri'; b.textContent='Turn pro →';
  b.style.marginTop='.6rem';
  b.onclick=()=>{ G.started=true; render(); };
  p.appendChild(b);
  return p;
}

function hud(){
  const p=document.createElement('div'); p.className='panel';
  const d=document.createElement('div'); d.className='hud';
  d.innerHTML =
    '<div><span>Record</span><b>'+G.wins+'-'+G.losses+'</b></div>'+
    '<div><span>Rank</span><b>'+(G.rank==null?'Unranked':(G.rank===0?'CHAMP':'#'+G.rank))+'</b></div>'+
    '<div><span>Streak</span><b>'+G.streak+'</b></div>'+
    '<div><span>Upgrade pts</span><b style="color:var(--accent)">'+G.pts+'</b></div>'+
    '<div><span>Lives</span><b>'+(2-G.losses)+'</b></div>';
  p.appendChild(d); return p;
}

function resultBox(){
  const {o,won,fin}=G.last;
  const p=document.createElement('div'); p.className='panel';
  const b=document.createElement('div'); b.className='big '+(won?'win':'loss');
  b.textContent = won ? ('def. '+o.f.name+(fin?' by KO/TKO':' by decision')) : ('lost to '+o.f.name);
  p.appendChild(b);
  const L=G.log[G.log.length-1];
  const rd=document.createElement('div'); rd.className='note';
  rd.innerHTML = 'Rounds: ' + L.rounds.map((w,i)=>
    '<b style="color:'+(w?'var(--accent)':'var(--accent2)')+'">R'+(i+1)+(w?' ✓':' ✗')+'</b>').join(' &nbsp; ') +
    ' &nbsp;→&nbsp; ' + L.roundsWon + '-' + (3-L.roundsWon);
  p.appendChild(rd);
  const n=document.createElement('div'); n.className='note';
  n.textContent = 'The model gave you '+(o.p*100).toFixed(1)+'% per round ('+amer(o.p)+'), '+
    (bo3(o.p)*100).toFixed(1)+'% to win the fight.'+
    (won ? '  +'+(o.reward+(fin?1:0))+' upgrade points.' : (G.losses<2?'  One life left.':''));
  p.appendChild(n);
  return p;
}

// What is +1 in this category actually WORTH? Playtest: "it's not clear how
// impactful each category is." So don't make them guess — ASK THE MODEL. Bump
// the attribute, re-score the hardest fight on offer, show the delta. It's the
// honest answer, it teaches what the sim cares about, and it makes the choice a
// decision instead of a shrug.
function marginal(attrId, oppName){
  const before = winProb(oppName);
  const old = G.attrs[attrId];
  if (old >= ATTR_MAX) return null;
  G.attrs[attrId] = old + 1;
  const after = winProb(oppName);
  G.attrs[attrId] = old;
  return bo3(after) - bo3(before);
}

function upgrade(){
  const p=document.createElement('div'); p.className='panel';
  const target = (offers()[1] || offers()[0] || {}).f;
  p.innerHTML='<div class="rl">Spend upgrade points ('+G.pts+')' +
    (target ? ' — value of +1 vs '+target.name : '') + '</div>';
  for(const A of ATTRS){
    const row=document.createElement('div'); row.className='attr';
    const l=document.createElement('label'); l.textContent=A.label;
    const bar=document.createElement('div');
    bar.style.cssText='height:6px;background:var(--surface2);border-radius:3px;overflow:hidden';
    bar.innerHTML='<div style="height:100%;width:'+(G.attrs[A.id]/ATTR_MAX*100)+'%;background:var(--accent)"></div>';
    const btn=document.createElement('button'); btn.className='btn';
    const mv = target ? marginal(A.id, target.name) : null;
    btn.textContent = (mv==null) ? '+1' : ('+1  ('+(mv>=0?'+':'')+(mv*100).toFixed(1)+'%)');
    btn.style.padding='.15rem .4rem'; btn.style.fontSize='.68rem'; btn.style.whiteSpace='nowrap';
    if(mv!=null && mv>0.004) btn.style.borderColor='var(--accent)';
    btn.disabled = G.pts<1 || G.attrs[A.id]>=ATTR_MAX;
    if(btn.disabled) btn.style.opacity=.3;
    btn.onclick=()=>{ if(G.pts<1||G.attrs[A.id]>=ATTR_MAX) return; G.attrs[A.id]++; G.pts--; render(); };
    row.appendChild(l); row.appendChild(bar); row.appendChild(btn);
    p.appendChild(row);
  }
  return p;
}

function offerBox(){
  const p=document.createElement('div'); p.className='panel';
  p.innerHTML='<div class="rl">Pick your next fight</div>';
  const g=document.createElement('div'); g.className='opps';
  const list=offers();
  for(const o of list){
    const b=document.createElement('button'); b.className='opp'+(o.p<0.4?' risky':'');
    const rk=o.f.rankNum===99?'Unranked':(o.f.rankNum===0?'CHAMPION':'#'+o.f.rankNum);
    b.innerHTML='<div class="rk">'+rk+'</div><div class="nm"></div><div class="rec"></div>'+
      '<div class="odds">You: <b style="color:'+(bo3(o.p)>=0.5?'var(--accent)':'var(--accent2)')+'">'+amer(bo3(o.p))+'</b> · '+(bo3(o.p)*100).toFixed(0)+'% to win</div>'+
      '<div class="note" style="margin:.15rem 0 0">'+(o.p*100).toFixed(0)+'% per round · best of 3</div>'+
      '<div class="rw">+'+o.reward+' upgrade pts if you win</div>';
    b.querySelector('.nm').textContent=o.f.name;
    b.querySelector('.rec').textContent=o.f.record;
    b.onclick=()=>fight(o);
    g.appendChild(b);
  }
  p.appendChild(g);
  return p;
}

function logBox(){
  const p=document.createElement('div'); p.className='panel';
  p.innerHTML='<div class="rl">Your record</div>';
  const l=document.createElement('div'); l.className='log';
  if(!G.log.length) l.innerHTML='<span style="color:var(--muted)">No fights yet.</span>';
  G.log.slice().reverse().forEach(f=>{
    const d=document.createElement('div');
    d.innerHTML='<span class="'+(f.won?'w':'l')+'">'+(f.won?'W':'L')+'</span> '+
      (f.won&&f.fin?'KO ':'   ')+' vs '+f.opp+' <span style="color:var(--muted)">('+(f.p*100).toFixed(0)+'%)</span>';
    l.appendChild(d);
  });
  p.appendChild(l);
  return p;
}

function endBox(msg){
  const p=document.createElement('div'); p.className='panel';
  const b=document.createElement('div'); b.className='big '+(G.champ?'win':'loss'); b.textContent=msg;
  p.appendChild(b);
  const n=document.createElement('div'); n.className='note';
  const best = G.log.filter(f=>f.won).sort((a,b)=>a.p-b.p)[0];
  n.textContent = 'Final: '+G.wins+'-'+G.losses+(G.rank!=null?', peaked at '+(G.rank===0?'champion':'#'+G.rank):', never ranked')+
    (best?'. Best win: '+best.opp+' at '+(best.p*100).toFixed(0)+'%.':'');
  p.appendChild(n);
  p.appendChild(logBox());
  const b2=document.createElement('button'); b2.className='btn pri'; b2.textContent='New run';
  b2.onclick=newGame; p.appendChild(b2);
  return p;
}

fetch('climb-data.json').then(r=>r.json()).then(d=>{
  D=d;
  S = window.createScorer(d.FIGHTER_STATS, d.FIGHT_HISTORY, d.FIGHTERS);
  newGame();
}).catch(e=>{
  $('#app').innerHTML='<div class="load">Could not load climb-data.json — '+e.message+
    '<br><br>Run <b>python3 -m http.server</b> in the repo root, then open<br>'+
    '<b>localhost:8000/prototypes/the-climb.html</b></div>';
});
</script>
</body>
</html>
