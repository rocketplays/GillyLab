<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Six Degrees of the Octagon — GillyLab prototype</title>
<!--
  PROTOTYPE. Standalone: open it directly, no server needed (it fetches its data
  file alongside it — if your browser blocks file:// fetch, run
  `python3 -m http.server` from the repo root and open /prototypes/six-degrees.html).

  The whole point of this build is to answer ONE question that no amount of
  analysis can: is wandering the graph fun, or is it tedious? Play five puzzles.
  If you find yourself saying "oh RIGHT, he fought him", it works.

  Design notes, for the record:
   - You never type. Every move is a click on a face. Recognition, not recall —
     that was the fix for "having to type out older fighters is hard".
   - Opponents are sorted by fame so recognisable names surface first; this is a
     deliberate assist, not laziness.
   - The target is always pinned top-right, and any opponent who IS the target
     gets a gold ring, so you can never walk past the win.
   - Every card shows the bout that made the link (event + year). That's the
     payload — the path is a story, not a receipt.
-->
<style>
  :root{
    --bg:#0a0a0b; --surface:#111114; --surface2:#18181d; --border:#2a2a32;
    --accent:#00e668; --accent2:#ff3d00; --gold:#ffc531;
    --text:#f0f0f0; --muted:#666672; --card:#14141a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;padding:1rem;}
  .wrap{max-width:1000px;margin:0 auto}
  h1{font-size:1.25rem;margin:0 0 .15rem;letter-spacing:-.02em}
  h1 .g{color:var(--accent)}
  .sub{color:var(--muted);font-size:.8rem;margin:0 0 1rem}

  /* ── puzzle header ───────────────────────────────────────────── */
  .puz{background:var(--card);border:1px solid var(--border);border-radius:8px;
    padding:.85rem 1rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
  .puz-main{display:flex;align-items:center;gap:.7rem;flex:1;min-width:260px}
  .endp{display:flex;align-items:center;gap:.5rem}
  .endp .nm{font-weight:600;font-size:.95rem;line-height:1.1}
  .endp .rl{color:var(--muted);font-size:.65rem;text-transform:uppercase;letter-spacing:.08em}
  .arrow{color:var(--muted);font-size:1.1rem}
  .parbox{text-align:right}
  .parbox .v{font-size:1.35rem;font-weight:700;line-height:1}
  .parbox .l{color:var(--muted);font-size:.62rem;text-transform:uppercase;letter-spacing:.08em}
  .moves .v{color:var(--accent)}
  .moves.over .v{color:var(--accent2)}

  /* ── avatars ─────────────────────────────────────────────────── */
  .av{width:42px;height:42px;border-radius:50%;object-fit:cover;background:var(--surface2);
    border:1px solid var(--border);display:flex;align-items:center;justify-content:center;
    font-size:.7rem;font-weight:700;color:var(--muted);flex:none;overflow:hidden}
  .av.lg{width:54px;height:54px;font-size:.85rem}

  /* ── trail ───────────────────────────────────────────────────── */
  .trail{display:flex;align-items:center;gap:.3rem;flex-wrap:wrap;margin:1rem 0 .5rem;min-height:46px}
  .tnode{display:flex;align-items:center;gap:.4rem;background:var(--surface);
    border:1px solid var(--border);border-radius:99px;padding:.2rem .6rem .2rem .2rem;
    cursor:pointer;transition:border-color .15s}
  .tnode:hover{border-color:var(--accent)}
  .tnode .av{width:26px;height:26px;font-size:.55rem}
  .tnode span{font-size:.78rem;font-weight:500}
  .tnode.cur{border-color:var(--accent);background:rgba(0,230,104,.07)}
  .tsep{color:var(--muted);font-size:.7rem}

  /* ── opponent grid ───────────────────────────────────────────── */
  .head{display:flex;align-items:baseline;gap:.5rem;margin:1.1rem 0 .55rem;flex-wrap:wrap}
  .head b{font-size:.9rem}
  .head span{color:var(--muted);font-size:.75rem}

  /* ── how to play ─────────────────────────────────────────────── */
  .how{background:var(--surface);border:1px solid var(--border);border-left:2px solid var(--accent);
    border-radius:6px;padding:.6rem .8rem;margin:.9rem 0;font-size:.78rem;line-height:1.6;color:#c8c8cf}
  .how b{color:var(--text)}
  .how .tip{color:var(--accent)}

  /* ── target dossier ──────────────────────────────────────────── */
  .dos{background:var(--surface);border:1px solid var(--border);border-radius:8px;
    padding:.7rem .8rem;margin:.9rem 0}
  .dos-h{display:flex;align-items:center;gap:.4rem;font-size:.74rem;color:var(--muted);
    text-transform:uppercase;letter-spacing:.07em;margin-bottom:.5rem}
  .dos-h b{color:var(--gold);text-transform:none;letter-spacing:0;font-size:.85rem}
  .dos-list{display:flex;flex-wrap:wrap;gap:.3rem}
  .chip{display:flex;align-items:center;gap:.35rem;background:var(--surface2);
    border:1px solid var(--border);border-radius:99px;padding:.15rem .55rem .15rem .15rem;font-size:.72rem}
  .chip .av{width:20px;height:20px;font-size:.45rem}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:.5rem}
  .opp{display:flex;align-items:center;gap:.55rem;background:var(--card);
    border:1px solid var(--border);border-radius:8px;padding:.5rem;cursor:pointer;
    text-align:left;color:inherit;font:inherit;transition:border-color .15s,background .15s}
  .opp:hover{border-color:var(--accent);background:var(--surface2)}
  .opp .meta{min-width:0}
  .opp .nm{font-size:.8rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .opp .bt{font-size:.65rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .opp.target{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
  .opp.target .nm{color:var(--gold)}
  /* Bridge = this fighter is on the target's opponent list, i.e. picking him
     puts you one hop out. Surfaced, never hidden: hunting for the overlap by
     eye across 40 names is a reading-comprehension chore, not the game. */
  .opp.bridge{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .opp.bridge .nm{color:var(--accent)}
  .opp.seen{opacity:.4}
  .badge{font-size:.55rem;font-weight:700;letter-spacing:.06em;color:var(--gold);
    border:1px solid var(--gold);border-radius:3px;padding:0 .25rem;margin-left:.3rem;
    white-space:nowrap}
  .badge.br{color:var(--accent);border-color:var(--accent)}
  .chip.hot{border-color:var(--accent);background:rgba(0,230,104,.1)}
  .chip.hot span{color:var(--accent)}

  /* ── win ─────────────────────────────────────────────────────── */
  .win{background:var(--card);border:1px solid var(--accent);border-radius:8px;
    padding:1rem;margin:1rem 0}
  .win.lost{border-color:var(--accent2)}
  .win h2{margin:0 0 .5rem;font-size:1rem;color:var(--accent)}
  .win.lost h2{color:var(--accent2)}
  .rl2{color:var(--muted);font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;margin:.7rem 0 .15rem}
  .chain{font-size:.82rem;line-height:1.9}
  .chain b{color:var(--text)}
  .chain i{color:var(--muted);font-style:normal;font-size:.72rem}
  .chain.opt b{color:var(--gold)}
  .share{background:var(--surface2);border:1px solid var(--border);border-radius:6px;
    padding:.6rem .75rem;margin-top:.75rem;font-family:ui-monospace,Menlo,monospace;
    font-size:.78rem;white-space:pre-wrap}

  .bar{display:flex;gap:.4rem;margin:.9rem 0;flex-wrap:wrap}
  button.btn{background:var(--surface2);border:1px solid var(--border);color:var(--text);
    border-radius:6px;padding:.4rem .8rem;font-size:.78rem;cursor:pointer;font-weight:500}
  button.btn:hover{border-color:var(--accent)}
  button.btn.pri{background:var(--accent);color:#04120a;border-color:var(--accent);font-weight:700}
  select{background:var(--surface2);border:1px solid var(--border);color:var(--text);
    border-radius:6px;padding:.4rem .5rem;font-size:.78rem}
  .load{color:var(--muted);padding:2rem 0;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <h1>Six Degrees of the <span class="g">Octagon</span></h1>
  <p class="sub">Connect the two fighters by clicking who they fought — never type a name.
    <b style="color:var(--accent)">Green</b> means they've fought your target, so you're one hop out.
    Every click costs a move, <em>including backing up</em>.</p>
  <div id="app"><div class="load">Loading the board…</div></div>
</div>

<script>
const $ = s => document.querySelector(s);
let D = null, F = null, P = null;          // data, fighters, puzzles
let puz = null, trail = [], visited = new Set();

const eKey = (a,b) => a<b ? a+'-'+b : b+'-'+a;
const edgeOf = (a,b) => D.edges[eKey(a,b)] || null;
const initials = n => n.split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]||'').join('').toUpperCase();
const yearOf = d => { const m = /(\d{4})/.exec(d||''); return m ? m[1] : ''; };
// Fighter names carry apostrophes and the odd angle bracket — never innerHTML raw.
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// Avatar: real photo when we have one (70% of the board), initials otherwise.
function avatar(i, cls){
  const f = F[i];
  const el = document.createElement('div');
  el.className = 'av ' + (cls||'');
  el.textContent = initials(f.n);
  const img = new Image();
  img.onload = () => { el.textContent=''; img.style.cssText='width:100%;height:100%;object-fit:cover'; el.appendChild(img); };
  img.onerror = () => {};   // keep initials
  img.src = '../photos/' + f.s + '.jpg';
  return el;
}

// Shortest remaining distance — used only for the reveal + par, never shown mid-play.
function bfs(from, to){
  const prev = {[from]: -1}, q = [from];
  while(q.length){
    const c = q.shift();
    if (c === to){ const p=[]; let x=to; while(x!==-1){p.unshift(x); x=prev[x];} return p; }
    for (const n of F[c].o) if(!(n in prev)){ prev[n]=c; q.push(n); }
  }
  return null;
}

function boutLabel(a,b){
  const e = edgeOf(a,b);
  if (!e) return '';
  const ev = e[1] >= 0 ? D.pool[e[1]] : '';
  const y  = yearOf(e[0]);
  const org= e[4] >= 0 ? D.pool[e[4]] : '';
  const head = ev || org || 'bout';
  return head.length > 26 ? head.slice(0,25)+'…' + (y?' · '+y:'') : head + (y ? ' · '+y : '');
}

// ── the budget is the entire game ────────────────────────────────────────────
// You can never be STUCK: the board is one connected component, so every fighter
// reaches every other and a path always exists from wherever you are. That means
// there is no such thing as an illegal pick — which is exactly why there has to
// be a budget. Without one there is no fail state, no tension, and no reason not
// to click randomly until you bump into the target.
//
// par+3 is calibrated, not guessed. Measured over all 60 puzzles:
//     optimal play          3.7 hops
//     always click the most famous name   12.8
//     always click the biggest hub        16.5
//     random clicking                     19.9
// So a budget of par+3 (≈6.7) fails every brute-force heuristic and only pays
// out for actually knowing who fought who. That gap is the game.
//
// Spending a move to BACK UP costs one too. Free undo would let you explore the
// whole tree for nothing and hand the budget back.
const BUDGET_OVER_PAR = 3;
const budgetOf = p => p.par + BUDGET_OVER_PAR;
let spent = 0;

function start(p){
  puz = p; trail = [p.a]; visited = new Set([p.a]); spent = 0;
  render();
}

function move(i){
  if (spent >= budgetOf(puz)) return;
  trail.push(i); visited.add(i); spent++;
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}
// Backing up is a move. It's a real decision, not a free rewind.
function backTo(k){
  if (k === trail.length-1) return;
  if (spent >= budgetOf(puz)) return;
  trail = trail.slice(0, k+1); spent++;
  render();
}

function render(){
  const app = $('#app');
  app.innerHTML = '';
  const cur = trail[trail.length-1];
  const won = cur === puz.b;
  const hops = trail.length - 1;
  const left = budgetOf(puz) - spent;
  const lost = !won && left <= 0;

  // ── puzzle header ──
  const ph = document.createElement('div'); ph.className='puz';
  const main = document.createElement('div'); main.className='puz-main';
  const mk = (i,label) => {
    const d=document.createElement('div'); d.className='endp';
    d.appendChild(avatar(i,'lg'));
    const t=document.createElement('div');
    t.innerHTML = '<div class="rl">'+label+'</div><div class="nm"></div>';
    t.querySelector('.nm').textContent = F[i].n;
    d.appendChild(t); return d;
  };
  main.appendChild(mk(puz.a,'Start'));
  const ar=document.createElement('div'); ar.className='arrow'; ar.textContent='⟶'; main.appendChild(ar);
  main.appendChild(mk(puz.b,'Target'));
  ph.appendChild(main);
  const pb=document.createElement('div'); pb.className='parbox';
  pb.innerHTML='<div class="v">'+puz.par+'</div><div class="l">Par</div>';
  ph.appendChild(pb);
  const mb=document.createElement('div'); mb.className='parbox moves'+(left<=1?' over':'');
  mb.innerHTML='<div class="v">'+Math.max(0,left)+'</div><div class="l">Moves left</div>';
  ph.appendChild(mb);
  app.appendChild(ph);

  // ── trail ──
  const tr=document.createElement('div'); tr.className='trail';
  trail.forEach((n,k)=>{
    if(k) { const s=document.createElement('span'); s.className='tsep'; s.textContent='→'; tr.appendChild(s); }
    const t=document.createElement('div'); t.className='tnode'+(k===trail.length-1?' cur':'');
    t.appendChild(avatar(n));
    const s=document.createElement('span'); s.textContent=F[n].n; t.appendChild(s);
    t.title = 'Back to here';
    t.onclick=()=>backTo(k);
    tr.appendChild(t);
  });
  app.appendChild(tr);

  if (won || lost){ app.appendChild(endBox(won)); app.appendChild(controls()); return; }

  // ── how to play ──
  // Spelled out on the board, not in a modal nobody reads. A playtester couldn't
  // tell what the tiles even were ("are they all the person's opponents?"), which
  // means the mechanic was never going to teach itself.
  const how=document.createElement('div'); how.className='how';
  const tLast = esc(F[puz.b].n.split(/\s+/).pop());
  how.innerHTML = 'Every tile below is someone <b>'+esc(F[cur].n)+'</b> has actually fought. ' +
    'Click one and you <b>become</b> them — then you see who <i>they</i> fought. ' +
    'Keep going until <b>'+esc(F[puz.b].n)+'</b> turns up.' +
    '<br><span class="tip">Gold = that\'s '+esc(F[puz.b].n)+', click to win. ' +
    'Green = they fought '+tLast+', so you\'re one hop out.</span>' +
    '<br>No green on the board? Then you need to travel — look at who '+esc(F[puz.b].n)+
    ' fights below and head for that division and era.';
  app.appendChild(how);

  // ── target dossier ──
  // THE fix for "these are impossible". Recognition let you read the cards; it
  // did nothing for ROUTING — knowing which of 25 names bends toward the target.
  // That needs the target's opponents, and without them a mechanical player
  // solved 18% of puzzles. With them, 52%. Deliberately NOT auto-highlighting
  // the overlap: spotting the shared name yourself is the entire game.
  const dos=document.createElement('div'); dos.className='dos';
  const dh=document.createElement('div'); dh.className='dos-h';
  dh.innerHTML='Your target <b></b> has fought:';
  dh.querySelector('b').textContent=F[puz.b].n;
  dos.appendChild(dh);
  const dl=document.createElement('div'); dl.className='dos-list';
  const curOpp = new Set(F[cur].o);
  F[puz.b].o.slice().sort((x,y)=>F[y].f-F[x].f||F[x].n.localeCompare(F[y].n)).forEach(o=>{
    const c=document.createElement('div'); c.className='chip'+(curOpp.has(o)?' hot':'');
    c.appendChild(avatar(o));
    const s=document.createElement('span'); s.textContent=F[o].n; c.appendChild(s);
    dl.appendChild(c);
  });
  dos.appendChild(dl);
  app.appendChild(dos);

  // ── opponents ──
  const h=document.createElement('div'); h.className='head';
  const opps = F[cur].o.slice().sort((x,y)=> F[y].f-F[x].f || F[x].n.localeCompare(F[y].n));
  h.innerHTML = '<b></b><span>'+opps.length+' opponents — pick one</span>';
  h.querySelector('b').textContent = 'Who has ' + F[cur].n + ' fought?';
  app.appendChild(h);

  const g=document.createElement('div'); g.className='grid';
  const tOpp = new Set(F[puz.b].o);
  for(const o of opps){
    const b=document.createElement('button'); b.className='opp';
    const isTarget = o===puz.b;
    const isBridge = !isTarget && tOpp.has(o);
    if(isTarget) b.classList.add('target');
    if(isBridge) b.classList.add('bridge');
    if(visited.has(o)) b.classList.add('seen');
    b.appendChild(avatar(o));
    const m=document.createElement('div'); m.className='meta';
    const nm=document.createElement('div'); nm.className='nm'; nm.textContent=F[o].n;
    if(isTarget){ const s=document.createElement('span'); s.className='badge'; s.textContent='TARGET'; nm.appendChild(s); }
    else if(isBridge){
      const s=document.createElement('span'); s.className='badge br';
      s.textContent='FOUGHT '+F[puz.b].n.split(/\s+/).pop().toUpperCase();
      nm.appendChild(s);
    }
    const bt=document.createElement('div'); bt.className='bt'; bt.textContent=boutLabel(cur,o);
    m.appendChild(nm); m.appendChild(bt); b.appendChild(m);
    b.onclick=()=>move(o);
    g.appendChild(b);
  }
  app.appendChild(g);
  app.appendChild(controls());
}

// The reveal — and the only place right/wrong is ever stated.
//
// Deliberately NOT during play: "warmer / colder" after each pick would let you
// hill-climb to the answer by trial and error without knowing a thing about the
// sport, which is the one skill this game is supposed to test. So you get no
// feedback per move; the gold TARGET ring is the single exception, and it only
// means "you are exactly one hop away".
function endBox(won){
  const hops = trail.length-1;
  const w=document.createElement('div'); w.className='win'+(won?'':' lost');
  const h=document.createElement('h2');
  if (won){
    const d = hops - puz.par;
    h.textContent = 'Connected in '+hops+' — '+(d<=0?'par, optimal chain.':d===1?'one over par.':d+' over par.');
  } else {
    h.textContent = 'Out of moves — '+F[puz.b].n+' got away.';
  }
  w.appendChild(h);

  const label=document.createElement('div'); label.className='rl2';
  label.textContent = won ? 'Your chain' : 'You got as far as';
  w.appendChild(label);
  const c=document.createElement('div'); c.className='chain';
  trail.forEach((n,k)=>{
    const b=document.createElement('b'); b.textContent=F[n].n; c.appendChild(b);
    if(k<trail.length-1){
      const i=document.createElement('i'); i.textContent = '  — '+boutLabel(n,trail[k+1])+' →  ';
      c.appendChild(i);
    }
  });
  w.appendChild(c);

  // Show the optimal line once it can't help you — that's the teaching moment,
  // and the "oh, THAT guy" is the reason to come back tomorrow.
  const opt = bfs(puz.a, puz.b);
  if (!won || hops > puz.par){
    const l2=document.createElement('div'); l2.className='rl2'; l2.textContent='The par line';
    w.appendChild(l2);
    const c2=document.createElement('div'); c2.className='chain opt';
    opt.forEach((n,k)=>{
      const b=document.createElement('b'); b.textContent=F[n].n; c2.appendChild(b);
      if(k<opt.length-1){
        const i=document.createElement('i'); i.textContent='  — '+boutLabel(n,opt[k+1])+' →  ';
        c2.appendChild(i);
      }
    });
    w.appendChild(c2);
  }

  const sq = won
    ? trail.slice(1).map((_,k)=> k < puz.par ? '🟩':'🟨').join('')
    : '⬛'.repeat(budgetOf(puz));
  const sh=document.createElement('div'); sh.className='share';
  sh.textContent = 'Six Degrees of the Octagon\n'+F[puz.a].n+' ⟶ '+F[puz.b].n+'\n' +
    (won ? hops+' hops (par '+puz.par+') '+sq : 'X/'+budgetOf(puz)+' (par '+puz.par+') '+sq);
  w.appendChild(sh);
  return w;
}

function controls(){
  const bar=document.createElement('div'); bar.className='bar';
  const nx=document.createElement('button'); nx.className='btn pri'; nx.textContent='New puzzle';
  nx.onclick=()=>start(P[(Math.random()*P.length)|0]);
  bar.appendChild(nx);
  // Difficulty is a real dial, so let the player hold it while we learn what
  // "fun" is: par 2 easy / par 3 the game / par 4 the Friday.
  const dif=document.createElement('select');
  dif.innerHTML='<option value="">Difficulty…</option>'+
    [[2,'Easy (par 2)'],[3,'Medium (par 3)'],[4,'Hard (par 4)']]
      .map(([v,l])=>'<option value="'+v+'">'+l+'</option>').join('');
  dif.onchange=e=>{
    const v=+e.target.value; if(!v) return;
    const pool=P.filter(p=>p.par===v);
    if(pool.length) start(pool[(Math.random()*pool.length)|0]);
  };
  bar.appendChild(dif);
  const rs=document.createElement('button'); rs.className='btn'; rs.textContent='Restart';
  rs.onclick=()=>start(puz); bar.appendChild(rs);
  // Give up = burn the budget, which routes into the same reveal as running out.
  if(trail[trail.length-1]!==puz.b && spent < budgetOf(puz)){
    const gv=document.createElement('button'); gv.className='btn'; gv.textContent='Give up';
    gv.onclick=()=>{ spent = budgetOf(puz); render(); };
    bar.appendChild(gv);
  }
  const sel=document.createElement('select');
  sel.innerHTML='<option value="">Jump to a puzzle…</option>' +
    P.map((p,i)=>'<option value="'+i+'">par '+p.par+' — '+F[p.a].n+' ⟶ '+F[p.b].n+'</option>').join('');
  sel.onchange=e=>{ if(e.target.value!=='') start(P[+e.target.value]); };
  bar.appendChild(sel);
  return bar;
}

fetch('sixdegrees-data.json').then(r=>r.json()).then(d=>{
  D=d; F=d.fighters; P=d.puzzles;
  // Open on a par 2 — the on-ramp. par 2 is a pure visual intersection once the
  // dossier is up (100% solvable), so the first puzzle teaches the mechanic by
  // being winnable. Opening on par 3 taught nothing except that you lose.
  start(P.find(p=>p.par===2) || P[0]);
}).catch(e=>{
  $('#app').innerHTML='<div class="load">Could not load sixdegrees-data.json — '+e.message+
    '<br><br>If you opened this as a file://, your browser blocks local fetch.<br>'+
    'Run <b>python3 -m http.server</b> in the repo root, then open<br>'+
    '<b>localhost:8000/prototypes/six-degrees.html</b></div>';
});
</script>
</body>
</html>
