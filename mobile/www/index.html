<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>GillyLab</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

  <!-- The site's own dark-green aurora backdrop (see AURORA_CSS/AURORA_DIVS
       in worker/pages.js) -- rendered once here since this app never does a
       full page reload the way the site re-emits these on every navigation. -->
  <div id="bgfx"></div>
  <div id="bgedge"></div>

  <!-- No fixed top bar -- the bottom tab bar already shows what section
       you're in, so a persistent black title strip is redundant. Instead,
       the back button and the brand mark below are plain scrolling content
       at the top of #appScroll (mirrors the premium in-app SPA's own
       .back-btn: top-left, inline, scrolls away with the page instead of
       sitting in a sticky bar -- see index.html's own .back-btn / #app.js
       fighterGoBack()). Lives as a sibling of #app, which is all any
       screen's own render() ever touches, so both survive a screen's full
       innerHTML replacement automatically. Hidden on fullbleed screens
       (Climb's iframe) via .gl-app--fullbleed in app.css.

       The account entry point (#avatarBtn/#avatarMenu, js/avatar-menu.js)
       lives inside the brand row rather than as a fixed overlay -- it used
       to be position:fixed so it never scrolled away, but that meant it
       sat permanently on top of whatever page content happened to be
       underneath that top-right corner, in the way while scrolling. It's
       now plain scrolling content, positioned to the brand row's right
       edge, so it behaves exactly like the brand mark itself: visible at
       the top of the page, gone once you scroll past it. -->
  <main class="gl-app" id="appScroll">
    <button class="gl-back-inline" id="pageBackBtn" hidden aria-label="Back">&larr; Back</button>
    <div class="gl-page-brand">
      <img class="gl-page-brand-logo" src="https://gillylab.com/gl-logo.png?v=8" alt="">
      <span>GILLY<span class="a">LAB</span></span>
      <button class="gl-avatar-btn" id="avatarBtn" aria-label="Account menu" aria-haspopup="true" aria-expanded="false">
        <svg viewBox="0 0 24 24" class="gl-avatar-icon"><circle cx="12" cy="8" r="3.4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4.5 20c1.2-4 4-6 7.5-6s6.3 2 7.5 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <div class="gl-avatar-menu" id="avatarMenu" hidden role="menu" aria-label="Account menu">
        <button type="button" class="gl-avatar-menu-item" data-avatar-action="account" role="menuitem">Account</button>
        <button type="button" class="gl-avatar-menu-item" data-avatar-action="settings" role="menuitem">Settings</button>
        <button type="button" class="gl-avatar-menu-item" data-avatar-action="signout" role="menuitem">Sign Out</button>
      </div>
    </div>
    <div id="app"></div>
  </main>

  <!-- Native-style bottom tab bar. This is HTML/CSS, not a native UITabBar --
       see mobile/README.md for why that trade-off was made for the scaffold
       milestone. A carefully-styled web tab bar with safe-area insets and
       haptic feedback on tap reads as native to nearly everyone using the app.

       Account is no longer a tab at all, for free OR premium -- it moved to
       the persistent top-right avatar button (see #avatarBtn above, and
       js/avatar-menu.js) so it's reachable from every screen without eating
       a tab slot.

       The buttons themselves are rendered by router.js (see its FREE_TABS/
       PREMIUM_TABS/MORE_TAB + renderTabbar()), not hardcoded here -- a
       premium account gets a COMPLETELY different set of 6 direct tabs
       (Home/Events/Simulator/Odds/Bet Tracker/Tape Study) plus a 7th,
       "More" (js/more-sheet.js's bottom sheet, holding Rankings/Roster/
       Pick'em/Climb), not just an extra tab appended to the free set
       (Home/Events/Pick'em/Climb/Rankings/Roster). js/subscription.js
       calls router.js's setPremiumMode() once it knows the signed-in
       account's plan, which re-renders this nav's contents entirely.
       Starts empty; router.js's init() renders the free set immediately
       (matching isPremium's false default) before wiring click delegation. -->
  <nav class="gl-tabbar" id="tabbar"></nav>

  <!-- "More" tab's overflow sheet -- premium-only, the 7th tab slot (see the
       tab-bar comment above + more-sheet.js). Premium's direct 6 tabs are
       Home/Events/Simulator/Odds/Bet Tracker/Tape Study, so this sheet now
       holds the rest -- Rankings, Roster, Pick'em, Climb -- rather than the
       one-off Fight Simulator entry it used to. Account lives in the
       top-right avatar menu, not in here. A new, app-native bottom-sheet
       pattern (slides up from behind the tab bar), not the site's borrowed
       centered-dialog #mh-box style used for the Deep Dive modal -- that CSS
       is the SITE's own injected stylesheet and has no bottom-sheet variant
       to copy. -->
  <div id="moreOverlay" class="more-overlay" hidden></div>
  <div id="moreSheet" class="more-sheet" hidden role="dialog" aria-modal="true" aria-label="More">
    <div class="more-sheet-grabber"></div>
    <div id="moreSheetList"></div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/native.js"></script>
  <script src="js/router.js"></script>
  <script src="js/more-sheet.js"></script>
  <script src="js/avatar-menu.js"></script>
  <script src="js/subscription.js"></script>
  <script src="js/screens/home.js"></script>
  <script src="js/screens/climb.js"></script>
  <script src="js/screens/pickem.js"></script>
  <script src="js/screens/fighter.js"></script>
  <script src="js/screens/roster.js"></script>
  <script src="js/screens/matchup.js"></script>
  <script src="js/screens/rankings.js"></script>
  <script src="js/screens/account.js"></script>
  <script src="js/screens/settings.js"></script>
  <script src="js/screens/premium.js"></script>
  <script src="js/screens/simulator.js"></script>
  <script src="js/screens/odds.js"></script>
  <script src="js/screens/bettracker.js"></script>
  <script src="js/screens/tapestudy.js"></script>
  <script src="js/screens/login.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
