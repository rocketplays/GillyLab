:root{
  --bg:#0a0a0b;
  --card:#141416;
  --accent:#00e668;
  --text:#f4f5f7;
  --muted:rgba(255,255,255,.55);
  --line:rgba(255,255,255,.09);
}

*{box-sizing:border-box;margin:0;padding:0}

html,body{background:var(--bg);width:100%;min-height:100%}

body{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:28px 14px;
  font-family:'Barlow',-apple-system,sans-serif;
  color:var(--text);
  -webkit-font-smoothing:antialiased;
}

.card{
  position:relative;
  width:1080px;
  max-width:100%;
  background:radial-gradient(1000px 620px at 50% -8%, #15201a 0%, var(--bg) 55%);
  border-radius:14px;
  overflow:hidden;
}

.content{
  position:relative; z-index:2;
  padding:52px 60px 60px;
  display:flex; flex-direction:column;
}

.top-row{
  display:flex; align-items:center; justify-content:space-between;
}
.brand{
  display:inline-flex; align-items:center; gap:12px;
  font-family:'Barlow Condensed',sans-serif;
  font-weight:900; font-size:30px; letter-spacing:.12em;
}
.brand img{height:44px;width:auto;display:block}
.brand .a{color:var(--accent)}

.offer-tag{
  font-family:'Barlow Condensed',sans-serif;
  font-weight:700; font-size:16px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--muted);
}
.offer-tag b{color:var(--text)}

/* Everything now lives right under the logo, sized to be read at a
   glance rather than centered in a lot of open air. */
.offer{
  margin-top:34px;
  display:flex; flex-direction:column; gap:20px;
}

.eyebrow{
  font-family:'Barlow Condensed',sans-serif;
  font-weight:800; font-size:24px; letter-spacing:.06em; text-transform:uppercase;
  color:var(--accent);
}

.headline{
  font-family:'Barlow Condensed',sans-serif;
  font-weight:900;
  font-size:150px;
  line-height:.92;
  letter-spacing:.002em;
}
.headline .was{
  color:var(--muted); font-weight:700; font-size:.4em;
  text-decoration:line-through; text-decoration-color:rgba(255,255,255,.3);
  margin-right:.22em;
}
.headline .fine{
  font-family:'Barlow',-apple-system,sans-serif;
  color:var(--muted); font-weight:500; font-size:.13em; letter-spacing:0;
  white-space:nowrap;
  margin-left:.3em; vertical-align:.24em;
}

.sub{
  font-size:26px; color:var(--text); line-height:1.45; max-width:900px;
}

.divider{height:1px; background:var(--line); margin-top:6px}

.claim{
  display:flex; flex-direction:column; gap:16px;
}
.claim-label{
  font-family:'Barlow Condensed',sans-serif;
  font-size:18px; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
  color:var(--muted);
}
.claim-row{
  display:flex; align-items:center; gap:26px; flex-wrap:wrap;
}

.code-chip{
  display:inline-flex; align-items:center; gap:16px;
  background:var(--card);
  border:2px dashed rgba(0,230,104,.55);
  border-radius:12px;
  padding:16px 26px;
  width:fit-content;
}
.code-chip .code{
  font-family:'Barlow Condensed',sans-serif;
  font-weight:900; font-size:44px; letter-spacing:.14em;
  color:var(--accent);
}
.code-chip .icon{
  width:28px;height:28px;color:var(--accent);opacity:.85;
}

.cta-url{
  font-family:'Barlow Condensed',sans-serif;
  font-weight:700; font-size:28px; letter-spacing:.02em;
  color:var(--muted);
}
.cta-url .a{color:var(--accent)}
</style>
