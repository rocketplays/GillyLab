name: Measure Cito Result Latency

# ONE-OFF DIAGNOSTIC (UFC 329, 2026-07-12). Polls the Cito events feed every
# ~10 min across the card window and records, per bout, the first moment Cito
# reports a completed result. Logs to a dedicated `cito-latency-log` branch so
# main history stays clean. Self-limits API usage: once every bout on the card is
# final, a `complete` flag in the log makes each later run skip the Cito call.
#
# DELETE this workflow (and the cito-latency-log branch) once the measurement is
# analysed — it is not meant to run beyond UFC 329.

on:
  schedule:
    # Every 10 min during 01:00–08:59 UTC on July 12 (UFC 329 window). Cron is UTC.
    - cron: '*/10 1-8 12 7 *'
  workflow_dispatch:   # manual trigger for a dry run

concurrency:
  group: cito-latency          # never let two polls race on the log branch
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (scripts)
        uses: actions/checkout@v4

      - name: Load prior log from measurement branch
        run: |
          git fetch origin cito-latency-log --depth=1 2>/dev/null || true
          if git show origin/cito-latency-log:cito-latency-log.json > cito-latency-log.json 2>/dev/null; then
            echo "loaded existing log ($(wc -c < cito-latency-log.json) bytes)"
          else
            echo '{}' > cito-latency-log.json
            echo "no existing log — starting fresh"
          fi

      - name: Stop early if measurement already complete (no API call)
        id: gate
        run: |
          if node -e "process.exit(JSON.parse(require('fs').readFileSync('cito-latency-log.json','utf8')).complete ? 0 : 1)" 2>/dev/null; then
            echo "done=true" >> "$GITHUB_OUTPUT"
            echo "measurement complete — skipping Cito fetch to save quota."
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch Cito events feed (one call)
        if: steps.gate.outputs.done != 'true'
        run: |
          TODAY=$(date -u '+%Y-%m-%d')
          curl -sf \
            -H "x-api-key: ${{ secrets.MMAAPI_KEY }}" \
            "https://api.citoapi.com/api/v1/ufc/events?from=${TODAY}&includeBouts=true&limit=20" \
            -o data/_cito-live.json || echo "fetch failed (non-fatal)"

      - name: Record observations
        if: steps.gate.outputs.done != 'true'
        run: node scripts/measure-cito-latency.cjs data/_cito-live.json cito-latency-log.json

      - name: Commit log to measurement branch
        if: steps.gate.outputs.done != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B cito-latency-log
          git add -f cito-latency-log.json
          git diff --staged --quiet && echo "no changes" && exit 0
          git commit -m "measure: cito latency poll $(date -u '+%Y-%m-%dT%H:%MZ')"
          git push -f origin cito-latency-log
