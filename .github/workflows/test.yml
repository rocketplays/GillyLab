name: Tests

# Guards the data/parsing scripts. Runs only when script code changes (not on the
# odds-data cron commits), and is separate from update-odds so a failing test
# never blocks the odds/news/events refresh.
on:
  push:
    paths:
      - 'scripts/**'
      - 'worker/**'
      # index.html holds the scouting copy that test-scouting-lines.cjs guards, so a
      # change to path() has to run these tests — without this the one test that
      # checks that code would never fire on the commit that broke it. Safe despite
      # the note above about cron commits: those are pushed with GITHUB_TOKEN, and
      # GitHub does not trigger workflows from GITHUB_TOKEN pushes (same mechanism
      # deploy.yml relies on to avoid double-deploying).
      - 'index.html'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'worker/**'
      - 'index.html'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax-check key scripts
        run: |
          node -c scripts/fetch-card-changes.cjs
          node -c scripts/apply-card-changes.cjs
          node -c scripts/apply-fighter-overrides.cjs
          node -c scripts/fetch-espn-events.cjs
          node -c scripts/fetch-fighter-news.cjs
          node -c scripts/emit-pickem-results.cjs
          node -c scripts/scouting-lines.cjs

      - name: Run unit tests
        run: |
          node scripts/test-card-changes.cjs
          node scripts/test-fighter-news.cjs
          node scripts/test-espn-bouts.cjs
          node scripts/test-pickem.mjs

      # Generates every path-to-victory line from the real fighter stats and checks
      # each claim against the numbers behind it. Also fails if a rule stops matching
      # anything (reworded copy silently disarming a check) or if any of its ten
      # planted bugs slips through.
      - name: Vet the scouting lines
        run: node scripts/test-scouting-lines.cjs
