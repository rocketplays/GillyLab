name: Discover Event API Format
on:
  workflow_dispatch:
jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Fetch UFC events
        run: |
          mkdir -p data
          echo "=== Future events ===" && curl -sf -H "x-api-key: ${{ secrets.MMAAPI_KEY }}" "https://api.citoapi.com/api/v1/ufc/events?from=2026-06-01&includeBouts=true&limit=3" | tee data/event-sample.json
          echo "=== Belgrade event ===" && curl -sf -H "x-api-key: ${{ secrets.MMAAPI_KEY }}" "https://api.citoapi.com/api/v1/ufc/events/ufc_fight_night_belgrade_26702?includeBouts=true"
          echo "=== Rankings ===" && curl -sf -H "x-api-key: ${{ secrets.MMAAPI_KEY }}" "https://api.citoapi.com/api/v1/ufc/rankings" | tee data/rankings-sample.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/event-sample.json data/rankings-sample.json
          git diff --staged --quiet && exit 0
          git commit -m "save API samples"
          git push
