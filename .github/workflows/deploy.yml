name: Deploy to Cloudflare

# Auto-deploy the site to the Cloudflare Worker on every push to main, so GitHub
# main is the single source of truth for the live site — a plain `git push` now
# publishes, no local `npm run deploy` needed.
#
# Note: the twice-daily "Update UFC Odds" workflow deploys itself on its schedule.
# Its commit is pushed with the built-in GITHUB_TOKEN, and GitHub deliberately does
# NOT let a GITHUB_TOKEN push trigger other workflows — so this deploy does not
# double-fire for odds updates.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true   # if pushes stack up, only the newest deploys

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps (wrangler)
        run: npm install
      - name: Build + deploy to Cloudflare
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
