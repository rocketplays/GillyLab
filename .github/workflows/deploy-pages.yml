name: Deploy site to GitHub Pages

# Robust replacement for the built-in "pages build and deployment", which was
# timing out on this large static site. We assemble a clean, trimmed artifact
# (no .git history, no Python scripts, no scratch/review files) and deploy it
# with GitHub's official Pages actions.
#
# IMPORTANT: In repo Settings -> Pages, set "Build and deployment" Source to
# "GitHub Actions" so this workflow is what publishes the site.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble clean site
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '.git' --exclude '.github' --exclude '_site' \
            --exclude 'Gilly Lab' \
            --exclude '__pycache__' \
            --exclude 'scripts/espn-import-output' \
            --exclude '*.py' --exclude '*.md' --exclude '*.txt' \
            --exclude 'data/_*' \
            ./ _site/
          touch _site/.nojekyll
          [ -f CNAME ] && cp -f CNAME _site/CNAME
          echo "Deploying $(find _site -type f | wc -l) files, $(du -sh _site | cut -f1) total"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
