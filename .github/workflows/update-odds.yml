name: Update UFC Odds

on:
  schedule:
    - cron: '0 12 * * *'   # 8:00 AM ET (EDT / UTC-4)
    - cron: '0 0 * * *'    # 8:00 PM ET (EDT / UTC-4)
  workflow_dispatch:        # allow manual trigger from GitHub UI

jobs:
  update-odds:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch odds from The Odds API
        run: |
          # Non-fatal: fetch to a temp file and only swap it in on a successful,
          # non-empty response — so a transient API error/rate-limit keeps the
          # last-good odds.json and lets the rest of the run (and deploy) proceed.
          mkdir -p data
          if curl -sf \
            "https://api.the-odds-api.com/v4/sports/mma_mixed_martial_arts/odds/?apiKey=${{ secrets.ODDS_API_KEY }}&regions=us&markets=h2h,totals&oddsFormat=american" \
            -o data/odds.json.new && [ -s data/odds.json.new ]; then
            mv data/odds.json.new data/odds.json
            echo "Odds fetched — $(wc -c < data/odds.json) bytes"
          else
            rm -f data/odds.json.new
            echo "Odds fetch failed (non-fatal); keeping existing data/odds.json"
          fi

      - name: Update odds line-movement history
        run: node scripts/update-odds-history.cjs

      # ESPN is the sole source for the card list and results. Cito was retired on
      # 2026-07-09: it lagged ~10 days on bout sync, omitted whole cards, returned
      # every bout twice with the duplicates disagreeing, and re-published 2025's
      # PPVs (UFC 314-322) as upcoming 2026 cards. ESPN carries the finish detail
      # natively ("Suloev Stretch"), one object per bout, and a live period/clock.
      #
      # No key, no quota. The script is defensive: it refuses to overwrite a good
      # feed with a degraded one (zero upcoming events, or a card that suddenly
      # lost half its bouts), so a partial ESPN outage keeps the last-good files.
      - name: Fetch UFC events + results from ESPN
        run: |
          if node scripts/fetch-espn-events.cjs; then
            echo "Events fetched — $(wc -c < data/event.json) bytes upcoming, $(wc -c < data/event-recent.json) bytes recent"
          else
            echo "ESPN fetch failed (non-fatal); keeping existing data/event.json + event-recent.json"
          fi

      # Derive short-notice replacements + "bout may change" (opponent withdrew,
      # no replacement yet) from each upcoming event's Wikipedia Background
      # section and mark them on event.json. Runs BEFORE the manual override
      # steps so a hand-entered override still has the final say. Non-fatal:
      # Wikipedia may be unavailable or a very new event may have no page yet.
      - name: Derive card changes from Wikipedia
        run: node scripts/fetch-card-changes.cjs || true

      - name: Apply card changes to event.json
        run: node scripts/apply-card-changes.cjs || true

      - name: Re-apply manual card-section overrides
        run: node scripts/apply-card-section-overrides.cjs

      - name: Re-apply manual fighter opponent overrides
        run: node scripts/apply-fighter-overrides.cjs

      - name: Re-apply manual missing-bout overrides
        run: node scripts/apply-missing-bout-overrides.cjs

      # Runs AFTER the override steps so manually-added fighters get news too.
      # Aggregate recent per-fighter news (Google News RSS) for fighters on the
      # imminent card and flag injury/withdrawal stories. Non-fatal + keep-last-good.
      - name: Fetch fighter news
        run: node scripts/fetch-fighter-news.cjs || true

      - name: Download fighter photos
        run: |
          mkdir -p data/photos
          for src in data/event.json data/event-recent.json; do
            [ -f "$src" ] && jq -r '.data[].bouts[].fighters[] | select(.fighterSlug != null) | "\(.fighterSlug)\t\(.fighterName)"' "$src" 2>/dev/null
          done | \
          sort -u | \
          while IFS=$'\t' read -r slug name; do
            target="data/photos/${slug}.png"
            [ -f "$target" ] && echo "Cached: $slug" && continue
            wiki_title=$(echo "$name" | sed 's/ /_/g')
            thumbnail=$(curl -sf --max-time 10 \
              -H "User-Agent: GillyLab/1.0 (https://gillylab.com)" \
              "https://en.wikipedia.org/api/rest_v1/page/summary/${wiki_title}" 2>/dev/null | \
              jq -r '.thumbnail.source // empty' 2>/dev/null)
            if [ -n "$thumbnail" ]; then
              curl -sf --max-time 15 \
                -H "User-Agent: GillyLab/1.0 (https://gillylab.com)" \
                -o "$target" "$thumbnail" \
                && echo "Downloaded: $slug" \
                || { rm -f "$target"; echo "Failed: $slug"; }
            else
              echo "No Wikipedia photo: $name"
            fi
          done
          echo "Photos cached: $(ls data/photos/ 2>/dev/null | wc -l)"

      # Compare the (faster) odds feed against the card feed and email if an
      # upcoming card looks out of date — after the override steps, so anything
      # already patched doesn't alert. Non-fatal.
      - name: Alert on odds/card discrepancies
        run: node scripts/odds-card-alert.cjs || true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}

      # After a card, recompute the 9 box-score FIGHTER_STATS fields (slpm, strAcc,
      # sapm, strDef, kd, tdLanded, tdAcc, tdDef, subAvg) for that card's fighters
      # from ESPN's full bout log, so career averages include the new fight, and
      # patch just those fields in index.html. --recent no-ops when no completed
      # card fell in the last 3 days; idempotent + self-healing (re-runs correct
      # any ESPN lag/provisional box scores). Bio, fight history and odds history
      # are handled elsewhere.
      # Runs BEFORE the landing/profile regen so the lite profiles pick up the
      # fresh stats. Non-fatal.
      - name: Recompute post-card fighter stats
        run: python3 scripts/recompute-card-stats.py --recent || true

      # Fold the finished bouts the live poller captured (data/live-card.json) into
      # the STATIC FIGHT_HISTORY in index.html. The app live-merges that file in the
      # browser so the full profile is always current, but the lite (SEO) profiles are
      # generated from static FIGHT_HISTORY — so record, finish rate and win streak lag
      # there until the bout is persisted. De-duped by opponent+date, idempotent (the
      # 3-day window re-runs never double-add). Must run BEFORE gen-landing-data so the
      # derived record/finRate/streak pick up the new bout. Non-fatal.
      - name: Persist finished bouts into static fight history
        run: node scripts/append-card-history.cjs || true

      # Two different fighters sharing one name silently weld into one identity —
      # every consumer of FIGHT_HISTORY matches by name. That's how Brendan Allen
      # ended up with a flyweight's Bruno Silva on his record for months, found by
      # a user playing with the site rather than by anything here.
      #
      # append-card-history above is exactly where a new one enters: it writes
      # fresh bouts keyed by whatever name the feed used. So audit right after it.
      #
      # 180 collisions are baselined and tolerated (data/name-collisions-baseline.json)
      # — failing on those would cry wolf and get muted in a week. This fires only
      # on a NEW one, and emits a ::warning:: so it lands on the run page.
      #
      # `|| true`: a data-quality finding must never block the odds update the site
      # actually serves. The warning is the product, not the exit code. If these
      # start firing often, that's the evidence for keying FIGHT_HISTORY by ESPN
      # athlete ID instead of by name, which kills the whole bug class.
      - name: Audit for new fighter-name collisions
        run: node scripts/audit-name-links.cjs --check || true

      # Aliases are the benign half (one man, two spellings) and they're REAL
      # fights — the map keeps them out of the collision bucket. Regenerate so it
      # tracks the history it describes.
      - name: Refresh the name-alias map
        run: node scripts/audit-name-links.cjs --write || true

      # Regenerate the public landing page's live data snapshot (featured
      # division rankings + latest roster changes) from the current repo state,
      # so the logged-out marketing page stays current. Self-guards: keeps the
      # last-good file if a source can't be parsed. Non-fatal.
      - name: Regenerate landing-page data snapshot
        run: node scripts/gen-landing-data.cjs || true

      # Regenerate gl-sheet.js (the share-sheet renderer) from index.html so the free
      # /pickem "Share picks" image stays byte-identical to the in-app premium sheet.
      # Generated, never forked — index.html is the single source of truth.
      - name: Regenerate share-sheet renderer
        run: node scripts/gen-gl-sheet.cjs || true

      # Regenerate carousel-data.js (the landing feature carousel) from worker/pages.js
      # so the /subscribe page's carousel stays identical to the landing page's.
      - name: Regenerate subscribe carousel
        run: node scripts/gen-carousel.cjs || true

      # Compact server-only model-win-% map (from the paywalled predictions log) that
      # the Worker uses in the results-recap email to show FREE players the model's
      # take on their pick. Bundled into the Worker, never served to clients.
      - name: Regenerate pick'em model map
        run: node scripts/gen-pickem-model.cjs || true

      # Per-card Pick'em scoring table (winnerBase/methodBonus/roundBonus for the
      # current card) so the free /pickem page prices picks identically to the app
      # without shipping the paywalled odds/history. Reads the fresh odds + event.
      - name: Regenerate Pick'em card scoring table
        run: node scripts/gen-pickem-card.cjs || true

      # Rankings enrichment for the free /rankings page: canonical names, photo
      # slugs, and country flags for fighters the UFC feed leaves incomplete.
      - name: Regenerate rankings enrichment
        run: node scripts/gen-rankings-extra.cjs || true

      # Active roster + weekly changes for the free /roster page.
      - name: Regenerate roster snapshot
        run: node scripts/gen-roster.cjs || true

      # Phase-0 prediction capture: regenerate the production scorer from the
      # current index.html, then append a timestamped snapshot of each upcoming
      # fight's model win-probability alongside the current de-vigged market
      # price. Append-only, internal — this banks the time series we later grade
      # for calibration and closing-line value. Non-fatal so a hiccup here never
      # blocks the odds update/deploy.
      - name: Log model predictions vs market
        run: |
          node scripts/sim-backtest/extract-sim.cjs || true
          node scripts/log-predictions.cjs || true

      # Grade any now-decided fights against the banked snapshots and recompute
      # the internal CLV + calibration scorecard. Uses the freshly fetched
      # event/event-recent results. Non-fatal.
      - name: Grade resolved predictions
        run: node scripts/grade-predictions.cjs || true

      # Finalized results for pick'em grading (winner/method/round per bout of each
      # fully-final card). The Worker reads data/pickem-results.json to score picks.
      - name: Emit pick'em results
        run: node scripts/emit-pickem-results.cjs || true

      # Embed the scorecard into the Worker so the founder-only /scorecard page
      # renders without serving the raw prediction files to subscribers.
      - name: Regenerate internal scorecard data
        run: node scripts/gen-scorecard-data.cjs || true

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          FILES="index.html data/odds.json data/odds-history.json data/event.json data/event-recent.json data/card-changes.json data/photos/ data/odds-alert-state.json data/predictions-log.json data/predictions-graded.json data/predictions-scorecard.json data/fighter-news.json data/missing-bout-overrides.json data/espn-athletes.json data/espn-event-cache.json data/fight-stats.json data/live-card.json data/pickem-results.json data/pickem-card.json data/rankings-extra.json data/roster.json data/fighter-lite.json data/name-aliases.json gl-sheet.js worker/landing-data.js worker/carousel-data.js worker/pickem-model.js worker/scorecard-data.js"
          git add $FILES
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "chore: update UFC odds $(date -u '+%Y-%m-%d %H:%M UTC')"
          if git push; then exit 0; fi
          # Another push (e.g. a manual deploy) landed on main since we checked
          # out, so our push was a non-fast-forward. Reconcile: keep the freshly
          # fetched raw feeds, reset to the latest main to pick up whatever landed
          # (incl. manual edits), regenerate the derived files on top (generators
          # are idempotent and update-odds-history preserves existing days), then
          # push again.
          echo "push rejected — reconciling with latest main…"
          mkdir -p /tmp/feeds && cp -f data/odds.json data/event.json data/event-recent.json data/card-changes.json /tmp/feeds/ 2>/dev/null || true
          git fetch origin main && git reset --hard origin/main
          cp -f /tmp/feeds/odds.json /tmp/feeds/event.json /tmp/feeds/event-recent.json data/ 2>/dev/null || true
          cp -f /tmp/feeds/card-changes.json data/ 2>/dev/null || true
          node scripts/update-odds-history.cjs || true
          node scripts/apply-card-changes.cjs || true
          node scripts/apply-card-section-overrides.cjs || true
          node scripts/apply-fighter-overrides.cjs || true
          node scripts/apply-missing-bout-overrides.cjs || true
          python3 scripts/recompute-card-stats.py --recent || true
          node scripts/append-card-history.cjs || true
          node scripts/gen-landing-data.cjs || true
          node scripts/gen-gl-sheet.cjs || true
          node scripts/gen-carousel.cjs || true
          node scripts/gen-pickem-model.cjs || true
          node scripts/gen-pickem-card.cjs || true
          node scripts/gen-rankings-extra.cjs || true
          node scripts/gen-roster.cjs || true
          node scripts/fetch-fighter-news.cjs || true
          node scripts/sim-backtest/extract-sim.cjs || true
          node scripts/log-predictions.cjs || true
          node scripts/grade-predictions.cjs || true
          node scripts/gen-scorecard-data.cjs || true
          git add $FILES
          git diff --staged --quiet && echo "No changes after reconcile" && exit 0
          git commit -m "chore: update UFC odds (reconciled) $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push

      # The live site is served by the Cloudflare Worker from files bundled at
      # deploy time, so committing to git is no longer enough — we must redeploy
      # for the fresh odds/events to reach gillylab.com. Runs every time so the
      # live site always reflects the latest committed repo state.
      - name: Publish to Cloudflare
        run: |
          npm install
          npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
