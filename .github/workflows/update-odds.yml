name: Update UFC Odds

on:
  schedule:
    - cron: '0 12 * * *'   # 8:00 AM ET (EDT / UTC-4)
    - cron: '0 0 * * *'    # 8:00 PM ET (EDT / UTC-4)
  workflow_dispatch:        # allow manual trigger from GitHub UI

jobs:
  update-odds:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch odds from The Odds API
        run: |
          mkdir -p data
          curl -sf \
            "https://api.the-odds-api.com/v4/sports/mma_mixed_martial_arts/odds/?apiKey=${{ secrets.ODDS_API_KEY }}&regions=us&markets=h2h,totals&oddsFormat=american" \
            -o data/odds.json
          echo "Odds fetched — $(wc -c < data/odds.json) bytes"

      - name: Update odds line-movement history
        run: node scripts/update-odds-history.js

      - name: Fetch upcoming UFC events from Cito API
        run: |
          TODAY=$(date -u '+%Y-%m-%d')
          curl -sf \
            -H "x-api-key: ${{ secrets.MMAAPI_KEY }}" \
            "https://api.citoapi.com/api/v1/ufc/events?from=${TODAY}&includeBouts=true&limit=20" \
            -o data/event.json
          echo "Events fetched — $(wc -c < data/event.json) bytes"

      - name: Fetch last 10 completed UFC events (results) from Cito API
        run: |
          # Powers the homepage "View past event" dropdown. Non-fatal: if the
          # endpoint errors (e.g. plan limit), keep the previous file and let
          # the dropdown fall back to whatever completed events are in the feed.
          if curl -sf \
            -H "x-api-key: ${{ secrets.MMAAPI_KEY }}" \
            "https://api.citoapi.com/api/v1/ufc/events/recent?limit=10&includeBouts=true" \
            -o data/event-recent.json; then
            echo "Recent events fetched — $(wc -c < data/event-recent.json) bytes"
          else
            echo "Recent-events fetch failed (non-fatal); keeping existing data/event-recent.json"
          fi

      - name: Re-apply manual card-section overrides
        run: node scripts/apply-card-section-overrides.js

      - name: Re-apply manual fighter opponent overrides
        run: node scripts/apply-fighter-overrides.js

      - name: Re-apply manual missing-bout overrides
        run: node scripts/apply-missing-bout-overrides.js

      - name: Download fighter photos
        run: |
          mkdir -p data/photos
          for src in data/event.json data/event-recent.json; do
            [ -f "$src" ] && jq -r '.data[].bouts[].fighters[] | select(.fighterSlug != null) | "\(.fighterSlug)\t\(.fighterName)"' "$src" 2>/dev/null
          done | \
          sort -u | \
          while IFS=$'\t' read -r slug name; do
            target="data/photos/${slug}.png"
            [ -f "$target" ] && echo "Cached: $slug" && continue
            wiki_title=$(echo "$name" | sed 's/ /_/g')
            thumbnail=$(curl -sf --max-time 10 \
              -H "User-Agent: GillyLab/1.0 (https://gillylab.com)" \
              "https://en.wikipedia.org/api/rest_v1/page/summary/${wiki_title}" 2>/dev/null | \
              jq -r '.thumbnail.source // empty' 2>/dev/null)
            if [ -n "$thumbnail" ]; then
              curl -sf --max-time 15 \
                -H "User-Agent: GillyLab/1.0 (https://gillylab.com)" \
                -o "$target" "$thumbnail" \
                && echo "Downloaded: $slug" \
                || { rm -f "$target"; echo "Failed: $slug"; }
            else
              echo "No Wikipedia photo: $name"
            fi
          done
          echo "Photos cached: $(ls data/photos/ 2>/dev/null | wc -l)"

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/odds.json data/odds-history.json data/event.json data/event-recent.json data/photos/
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "chore: update UFC odds $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
