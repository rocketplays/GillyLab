name: Update UFC Odds

on:
  schedule:
    - cron: '0 12 * * *'   # 8:00 AM ET (EDT / UTC-4)
    - cron: '0 0 * * *'    # 8:00 PM ET (EDT / UTC-4)
  workflow_dispatch:        # allow manual trigger from GitHub UI

jobs:
  update-odds:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch odds from The Odds API
        run: |
          mkdir -p data
          curl -sf \
            "https://api.the-odds-api.com/v4/sports/mma_mixed_martial_arts/odds/?apiKey=${{ secrets.ODDS_API_KEY }}&regions=us&markets=h2h,totals&oddsFormat=american" \
            -o data/odds.json
          echo "Odds fetched — $(wc -c < data/odds.json) bytes"

      - name: Fetch upcoming UFC events from Cito API
        run: |
          TODAY=$(date -u '+%Y-%m-%d')
          curl -sf \
            -H "x-api-key: ${{ secrets.MMAAPI_KEY }}" \
            "https://api.citoapi.com/api/v1/ufc/events?from=${TODAY}&includeBouts=true&limit=20" \
            -o data/event.json
          echo "Events fetched — $(wc -c < data/event.json) bytes"

      - name: Download fighter photos
        run: |
          mkdir -p data/photos
          jq -r '.data[].bouts[].fighters[] | select(.fighterSlug != null and .imageUrl != null) | "\(.fighterSlug)\t\(.imageUrl)"' data/event.json 2>/dev/null | \
          sort -u | \
          while IFS=$'\t' read -r slug imageUrl; do
            [ "$imageUrl" = "null" ] && continue
            target="data/photos/${slug}.png"
            [ -f "$target" ] && echo "Cached: $slug" && continue
            http_code=$(curl -sf --max-time 15 \
              -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
              -H "Referer: https://www.ufc.com/" \
              -o "$target" -w "%{http_code}" "$imageUrl" 2>/dev/null)
            if [ "$http_code" = "200" ]; then
              echo "Downloaded: $slug"
            else
              rm -f "$target"
              echo "Failed ($http_code): $slug"
            fi
          done
          echo "Photos cached: $(ls data/photos/ | wc -l)"

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/odds.json data/event.json data/photos/
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "chore: update UFC odds $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
