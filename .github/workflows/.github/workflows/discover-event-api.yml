name: Discover Event API Format
on:
  workflow_dispatch:
jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Fetch UFC events
        run: |
          curl -sf -H "x-api-key: ${{ secrets.MMAAPI_KEY }}" "https://api.citoapi.com/api/v1/ufc/events?status=upcoming" -o data/event-sample.json
          curl -sf -H "x-api-key: ${{ secrets.MMAAPI_KEY }}" "https://api.citoapi.com/api/v1/ufc/rankings" -o data/rankings-sample.json
          cat data/event-sample.json
      - name: Commit samples
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/event-sample.json data/rankings-sample.json
          git diff --staged --quiet && exit 0
          git commit -m "save API samples"
          git push
