name: Live results during a card

# ESPN publishes a per-bout status with a live period/clock, so results land the
# moment a fight ends. GitHub's scheduler is the weak link: the docs warn that
# `schedule` "can be delayed during periods of high loads" and that "some queued
# jobs may be dropped". A pure */10 cron would therefore give 10-30 minute
# latency mid-card, with occasional gaps.
#
# So: a cheap cron tick wakes up, and if a card is actually live it stays awake
# and polls every 5 minutes itself. The cron is only a kickstarter, the loop does
# the real work, and the whole thing costs ~30 seconds on the ~99% of ticks that
# find nothing on.
#
# POLL was 120s (2 min) until 2026-08-01, raised to 300s (5 min) to cut ESPN
# request volume during a live card — reduces load on an endpoint we don't have
# a license for, at the cost of somewhat slower result updates for viewers.
#
# Windows are UTC. Saturday 06:00-23:59 covers everything from an early Shanghai
# card (prelims 07:00Z) to a Vegas main card (01:00Z Sunday); Sunday 00:00-09:00
# carries that Vegas card to its end.
#
# Dana White's Contender Series airs Tuesdays, 23:00:00.000Z every week per ESPN
# (Meta APEX, Las Vegas — checked weeks 1-10 of season 10, all identical). Added
# 2026-08-12 after week 1 got zero live coverage: results still landed via the
# twice-daily update-odds.yml rebuild, but that script never writes box scores or
# fight-history rows (that's fetch-espn-live.cjs-only), so both went missing.
# Tuesday 20:00-23:59 + Wednesday 00:00-09:00 gives the same lead-in/tail margin
# as the Saturday card. Left in permanently, not scoped to season 10 — DWCS comes
# back for new seasons through the year and the probe is a cheap no-op (~30s) on
# any Tuesday/Wednesday with nothing live, same as an off-week Saturday.
on:
  schedule:
    - cron: '*/10 6-23 * * 6'    # Saturday, all day UTC
    - cron: '*/10 0-9 * * 0'     # Sunday morning UTC — the tail of a US Saturday card
    - cron: '*/10 20-23 * * 2'   # Tuesday evening UTC — DWCS
    - cron: '*/10 0-9 * * 3'     # Wednesday morning UTC — the tail of a DWCS card
  workflow_dispatch:
    inputs:
      event:
        description: 'Force a specific event slug (testing)'
        required: false

# Never run two pollers at once. cancel-in-progress:false means a tick that
# arrives mid-card queues instead of killing the live poller; GitHub keeps at
# most one pending run per group, so ticks cannot pile up.
concurrency:
  group: gillylab-live-results
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 350          # under the 6h hard cap on a job
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # the poller rebases onto origin/main; a shallow clone can't

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Bail in seconds on the overwhelming majority of ticks. Only if a card is
      # inside its window do we pay for anything else.
      - name: Is a card live?
        id: probe
        run: |
          node scripts/fetch-espn-live.cjs --dry --no-enrich ${{ inputs.event && format('--event {0}', inputs.event) || '' }} | tee /tmp/probe.txt
          if grep -q 'no card in its live window' /tmp/probe.txt; then
            echo "live=false" >> $GITHUB_OUTPUT
          else
            echo "live=true" >> $GITHUB_OUTPUT
          fi

      # npm ci, not npm install: install can rewrite package-lock.json, which would
      # then be swept into the results commit.
      - name: Install deps (only when a card is live)
        if: steps.probe.outputs.live == 'true'
        run: npm ci

      - name: Poll ESPN every 5 minutes until the card ends
        if: steps.probe.outputs.live == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -uo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          DEADLINE=$(( $(date +%s) + 20400 ))   # 5h40m, inside the job timeout
          POLL=300
          POLLS=0
          DEPLOYS=0
          IDLE=0                                # consecutive no-change polls after the last fight

          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            POLLS=$((POLLS+1))
            OUT=$(node scripts/fetch-espn-live.cjs ${{ inputs.event && format('--event {0}', inputs.event) || '' }} 2>&1) || true
            echo "$OUT"

            if echo "$OUT" | grep -q 'no card in its live window'; then
              echo "::notice::card is over — polled ${POLLS}x, deployed ${DEPLOYS}x"
              break
            fi

            # The card holds the featured slot for 10h, but once every bout is
            # decided there is nothing left to fetch. Give it 2 quiet polls
            # (~10 min at the 5-min POLL interval) in case ESPN back-fills a
            # method, then stop.
            if echo "$OUT" | grep -q '^allDecided=true' && echo "$OUT" | grep -q '^changed=false'; then
              IDLE=$((IDLE+1))
              if [ "$IDLE" -ge 2 ]; then
                echo "::notice::every bout decided and quiet — polled ${POLLS}x, deployed ${DEPLOYS}x"
                break
              fi
            else
              IDLE=0
            fi

            if echo "$OUT" | grep -q '^changed=true'; then
              # Another workflow (the twice-daily rebuild) may have pushed since we
              # checked out. Rebase onto it; our patch is idempotent, so if the
              # rebase is hopeless we can safely reset and re-derive next poll.
              # data/fight-stats.json is 9.8MB; committing it after every fight would
              # add ~19MB of git objects per card (~1GB/year). The browser gets the
              # same rows from live-card.json (16KB), so the big file is committed
              # once, when the card is done.
              STAGE="data/event.json data/live-card.json"
              if echo "$OUT" | grep -q '^allDecided=true'; then STAGE="$STAGE data/fight-stats.json"; fi
              git add $STAGE
              if git diff --staged --quiet; then
                echo "nothing staged, odd — skipping"
              else
                git commit -m "live: results update $(date -u '+%Y-%m-%d %H:%M UTC')"
                if ! git push; then
                  echo "push rejected — rebasing onto origin/main"
                  git fetch origin main
                  # --autostash: fight-stats.json is intentionally left dirty mid-card
                  git rebase --autostash origin/main || { git rebase --abort; git reset --hard origin/main; }
                  git push || { echo "::warning::push still failing; will re-derive next poll"; git reset --hard origin/main; }
                fi
                # The Worker serves data/ from the bundle, so results only reach
                # visitors after a redeploy. Deploy only when something changed.
                if npm run deploy; then DEPLOYS=$((DEPLOYS+1)); else echo "::warning::deploy failed; next change will retry"; fi
              fi
            fi

            sleep "$POLL"
          done

          # The box-score file may still be dirty (e.g. the last fight's stats landed
          # on a poll that reported no other change). Commit it once on the way out.
          # Also emit finalized pick'em results now the card is done, so the Worker
          # can grade picks without waiting for the next daily odds run.
          node scripts/emit-pickem-results.cjs || true
          git add data/event.json data/live-card.json data/fight-stats.json data/pickem-results.json
          if ! git diff --staged --quiet; then
            git commit -m "live: final results + box scores $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push || { git fetch origin main; git rebase --autostash origin/main || git rebase --abort; git push || echo "::warning::final push failed"; }
            npm run deploy || echo "::warning::final deploy failed"
            echo "::notice::final sweep committed"
          fi

          echo "::notice::poller exiting after ${POLLS} polls, ${DEPLOYS} deploys"
